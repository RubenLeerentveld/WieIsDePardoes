# Bouwt bij elke push naar main een nieuw image en zet het op Docker Hub.
#
# Docker Hub bouwt niet zelf meer vanaf een repository, dus GitHub Actions doet
# het werk. Instellen kost twee secrets, zie DEPLOY.md §6.
#
# Het image komt terecht op:  <DOCKERHUB_USERNAME>/wie-is-de-mol

name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Bouwen en publiceren
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      # QEMU en Buildx zijn nodig om naast amd64 ook arm64 te bouwen, zodat het
      # image ook draait op een NAS of Raspberry Pi.
      - name: QEMU instellen
        uses: docker/setup-qemu-action@v3

      - name: Buildx instellen
        uses: docker/setup-buildx-action@v3

      - name: Inloggen op Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wie-is-de-mol:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wie-is-de-mol:${{ github.sha }}

      - name: Samenvatting
        run: |
          echo "### Image gepubliceerd" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ secrets.DOCKERHUB_USERNAME }}/wie-is-de-mol:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Klik in Portainer op **Pull and redeploy** om deze versie op te halen." >> $GITHUB_STEP_SUMMARY
