<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie is Pardoes? — Efteling</title>
<meta name="description" content="Een privé Wie is Pardoes?-spel voor onze Efteling-reis. Iedereen heeft een geheim.">
<meta name="theme-color" content="#0a1310">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<a class="skip-link" href="#main">Naar de inhoud</a>

<main id="main" class="gate">
  <div class="gate__inner anim-rise">

    <div class="seal seal--lg gate__seal">
      <img src="assets/logo.png" alt="">
    </div>

    <h1 class="gate__title">Wie is Pardoes?</h1>
    <span class="gate__place">Efteling</span>
    <p class="gate__motto">Iedereen heeft een geheim.</p>

    <!-- Live status, filled from data/game.json -->
    <div class="card card--accent text-center" id="cover-status" aria-live="polite">
      <span class="eyebrow eyebrow--dim">Het dossier laadt…</span>
    </div>

    <div class="stack mt-4" id="cover-actions"></div>

    <div class="gate__foot">
      <p class="whisper">Vertrouw niemand.</p>
    </div>

  </div>
</main>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script src="js/gate.js"></script>
</body>
</html>
