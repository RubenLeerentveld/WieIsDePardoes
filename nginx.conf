server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # The game data changes between days — never let a browser cache it.
    location ~* \.json$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Everything else is versioned by hand; a short cache is plenty.
    location ~* \.(css|js|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Atmospheric 404 instead of the nginx default.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
