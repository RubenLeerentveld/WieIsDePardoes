server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ------------------------------------------------------------------------
    # /live/ — de levende speldata, geschreven vanuit de adminpagina's
    #
    # Iedereen mag lezen; alleen de spelleider mag schrijven. De site leest
    # eerst hier en valt terug op /data/ als een bestand nog niet bestaat, dus
    # deze map mag leeg beginnen. Dat is belangrijk: op een NAS koppel je een
    # gewone map, en die wordt niet gevuld vanuit het image.
    # ------------------------------------------------------------------------
    location /live/ {
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        client_max_body_size 2m;
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;

        # Lezen mag zonder wachtwoord, schrijven niet.
        limit_except GET HEAD {
            auth_basic "Archief van de spelleider";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
    }

    # ------------------------------------------------------------------------
    # /inbox/ — ingeleverde tests van spelers
    #
    # Schrijven mag zonder wachtwoord: spelers hebben de code van de spelleider
    # niet. Elke speler schrijft naar een eigen bestandsnaam, dus inzendingen
    # kunnen elkaar niet overschrijven. De spelleider haalt ze op en verwerkt
    # ze; autoindex geeft de lijst als JSON terug.
    # ------------------------------------------------------------------------
    location /inbox/ {
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        # Een inzending is een paar honderd bytes; meer hoeft niemand te sturen.
        client_max_body_size 64k;

        autoindex on;
        autoindex_format json;

        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # De uitgangsdata uit het image. Alleen lezen; /live/ gaat hier overheen.
    location /data/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Alles hier is met de hand geversioneerd; een korte cache volstaat.
    location ~* \.(css|js|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
